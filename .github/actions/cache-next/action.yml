name: 'Cache next build'
description: 'Restore and cache Next.js build cache'
runs:
  using: 'composite'
  steps:
    - name: Cache Next.js build
      uses: actions/cache@v4
      env:
        cache-name: cache-next-build-v1
      with:
        path: |
          frontend/.next/cache
        key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('frontend/src/**/*.{ts,tsx,js,jsx}', 'frontend/next.config.*') }}
        restore-keys: |
          ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}-
          ${{ runner.os }}-${{ env.cache-name }}-
          ${{ runner.os }}-
