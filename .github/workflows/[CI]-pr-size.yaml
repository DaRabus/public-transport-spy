name: PR Size Labeler

on: [pull_request]

jobs:
  pr-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Label the PR size
    permissions:
      pull-requests: write
    steps:
      - uses: codelytv/pr-size-labeler@095a41fca88b8764fd9e008ad269bcdb82bb38b9 # v1.10.4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_max_size: 300
          s_max_size: 500
          m_max_size: 1000
          l_max_size: 3000
          fail_if_xl: false
          files_to_ignore: 'package-lock.json'
