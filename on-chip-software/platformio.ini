; PlatformIO Project Configuration File for Public Transport Spy ESP32
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default

; Upload speed (fast flashing)
upload_speed = 921600

; Partition table (huge_app gives 3MB for app code + 1MB for LittleFS storage)
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

; Mozilla root CA bundle for verified HTTPS (regenerate: see docs/on-chip-firmware.md)
board_build.embed_files = certs/x509_crt_bundle.bin

; Build configuration
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DSHOW_BACKEND_URL_FIELD

; Required library dependencies automatically fetched by PlatformIO
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    olikraus/U8g2 @ ^2.36.2
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    ricmoo/QRCode @ 0.0.1

; Retail build: backend URL baked in, no URL field in the setup portal.
;   PTS_BACKEND_URL=https://api.example.com PTS_FIRMWARE_VERSION=1.0.0 pio run -e esp32dev-retail
[env:esp32dev-retail]
extends = env:esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBACKEND_URL=\"${sysenv.PTS_BACKEND_URL}\"
    -DFIRMWARE_VERSION=\"${sysenv.PTS_FIRMWARE_VERSION}\"

; Host-side unit tests for include/device_logic.h:  pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_deps = bblanchon/ArduinoJson @ ^7.0.4
